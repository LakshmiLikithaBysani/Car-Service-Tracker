<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Service Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🚗 Car Service Tracker</h1>

        <div class="form-box">

            <h2>Add Service</h2>

            <input type="text" id="customer" placeholder="Customer Name">

            <input type="text" id="vehicle" placeholder="Vehicle Number">

            <select id="service">
                <option value="">Select Service</option>
                <option value="Oil Change">Oil Change</option>
                <option value="Engine Service">Engine Service</option>
                <option value="Brake Service">Brake Service</option>
                <option value="Car Wash">Car Wash</option>
                <option value="Full Service">Full Service</option>
            </select>

            <input type="date" id="date">

            <input type="number" id="cost" placeholder="Service Cost">

            <select id="status">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <button onclick="addService()">Add Service</button>

        </div>

        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search by vehicle number..."
                onkeyup="displayServices()"
            >
        </div>

        <div class="stats">

            <div class="stat">
                <h3 id="totalServices">0</h3>
                <p>Total Services</p>
            </div>

            <div class="stat">
                <h3 id="completedServices">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat">
                <h3 id="totalAmount">₹0</h3>
                <p>Total Amount</p>
            </div>

        </div>

        <div id="serviceList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
